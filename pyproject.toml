[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-to-work-splits"
# Read from gtw_splits.__version__ -- see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Better split comparisons for the Get To Work in-game speedrun timer"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Jack Ringel" }]
keywords = ["speedrun", "get-to-work", "splits", "timer"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
gtw-splits = "gtw_splits.cli:main"

[project.gui-scripts]
gtw-splits-gui = "gtw_splits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# One source of truth for the version. It was duplicated here and in
# __init__.py, with nothing keeping them in step -- and the number the window
# reports is the one in the package, so a bump missed here would ship metadata
# that disagreed with the running tool. setuptools reads the attribute
# statically, so this does not import the package at build time.
[tool.setuptools.dynamic]
version = { attr = "gtw_splits.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
